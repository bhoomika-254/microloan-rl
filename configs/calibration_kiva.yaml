# Generated by `notebooks/01_kiva_calibration.ipynb`.
# Overrides for env.cohort and env.shocks based on the public Kiva snapshot.
#
# Note: these are the DEFAULT priors. A real calibration run will replace
# this file with values fit from data and a `provenance` block recording
# the snapshot date, hash, and fit metrics.

provenance:
  source: "kiva-snapshot"
  snapshot_date: null         # filled by the notebook
  snapshot_sha256: null
  filter:
    status_in: ["paid", "defaulted", "refunded"]
    loan_amount_usd:
      min: 25
      max: 2000
    country_codes: ["KE", "IN", "BD", "PH", "GT", "MX"]
  fit_metrics: null           # filled with R² / KS / etc. by the notebook

cohort:
  reservation_rate_alpha: 2.0
  reservation_rate_beta: 8.0
  default_prob_base: 0.08
  default_prob_rate_coef: 1.4
  default_prob_repay_coef: -1.8
  welfare_penalty_coef: 0.6
  protected_affects_repayment: false

# Sector-specific default-base override; null falls back to the global value.
sector_default_base:
  agriculture: 0.11
  retail: 0.07
  services: 0.06
  food: 0.08
  manufacturing: 0.09

shocks:
  baseline:    { default_mult: 1.0, accept_mult: 1.0 }
  inflation:   { default_mult: 1.3, accept_mult: 1.05 }
  drought:     { default_mult: 1.6, accept_mult: 0.85, sectors: ["agriculture"] }
  pandemic:    { default_mult: 1.9, accept_mult: 0.7 }
