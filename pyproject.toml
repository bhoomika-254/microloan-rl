[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fairprice-mf"
version = "0.1.0"
description = "Fair, risk-sensitive reinforcement learning for microfinance loan pricing"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "FairPrice-MF Contributors" },
]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "gymnasium>=0.29",
    "numpy>=1.24",
    "scikit-learn>=1.3",
    "torch>=2.0",
    "pyyaml>=6.0",
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "pydantic>=2.5",
    "requests>=2.31",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=4",
    "ruff>=0.4",
    "mypy>=1.8",
    "pre-commit>=3.6",
]
training = [
    "stable-baselines3>=2.2",
    "tensorboard>=2.15",
    "wandb>=0.16",
]
notebooks = [
    "jupyterlab>=4",
    "matplotlib>=3.8",
    "seaborn>=0.13",
    "pandas>=2.1",
]

[project.scripts]
fairprice-audit = "fairprice_mf.scripts.audit:main"
fairprice-serve = "fairprice_mf.scripts.serve:main"

[tool.setuptools.packages.find]
include = ["fairprice_mf*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "N"]
ignore = ["E501"]
